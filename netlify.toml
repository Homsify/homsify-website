#  Homsify — Netlify build configuration
#  ---------------------------------------------------------------------------
#  Netlify reads this file automatically.
#
#  Netlify auto-detects Next.js and builds this project with its Next.js
#  Runtime. That runtime owns the publish directory and the serverless
#  functions it generates, so this file deliberately does NOT set a publish
#  directory, a functions directory, or a redirect for /api/quote — the
#  runtime handles all three. Earlier attempts to set them by hand are what
#  made the quote form return 404.

[build]
  command = "npm run build"

  #  Must be ".next", not "out". The site is no longer a static export, so no
  #  out/ directory is produced; Netlify's Next.js Runtime reads .next and
  #  publishes from there. This has to be stated here because the publish
  #  directory set in the Netlify UI when the repository was linked still
  #  said "out", and a deploy failed with "publish directory was not found".
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

#  Security headers. Mirrors public/_headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options   = "nosniff"
    X-Frame-Options          = "DENY"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "geolocation=(), microphone=(), camera=()"
